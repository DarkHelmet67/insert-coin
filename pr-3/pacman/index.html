<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Pac-Man</title>
    <script type="module" crossorigin src="./game.js"></script>
    <link rel="stylesheet" crossorigin href="./game.css">
  </head>
  <body>
    <!-- The cabinet's monitor is vertical: 224 pixels wide, 288 tall. -->
    <canvas id="screen" width="224" height="288">Serve un browser con supporto a Canvas.</canvas>
    <!-- Cabinet control panel: visible only on touch screens (see style.css). -->
    <div id="touch-panel" class="panel">
      <div class="pad pad-stick">
        <button type="button" class="key key-arrow key-up" data-key="ArrowUp" aria-label="Su">
          ▲
        </button>
        <button
          type="button"
          class="key key-arrow key-left"
          data-key="ArrowLeft"
          aria-label="Sinistra"
        >
          ◀
        </button>
        <button
          type="button"
          class="key key-arrow key-right"
          data-key="ArrowRight"
          aria-label="Destra"
        >
          ▶
        </button>
        <button type="button" class="key key-arrow key-down" data-key="ArrowDown" aria-label="Giù">
          ▼
        </button>
      </div>
      <div class="pad pad-system">
        <button type="button" class="key key-small" data-key="KeyC">MONETA</button>
        <button type="button" class="key key-small" data-key="KeyM">AUDIO</button>
      </div>
      <div class="pad pad-start">
        <button type="button" class="key key-start" data-key="Enter">START</button>
      </div>
    </div>
  </body>
</html>
