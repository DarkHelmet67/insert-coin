<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Space Invaders 2.5D</title>
    <script type="module" crossorigin src="./game.js"></script>
    <link rel="stylesheet" crossorigin href="./game.css">
  </head>
  <body>
    <!-- The 3D scene fills the stage; the score bars are drawn flat on top of it. -->
    <div id="stage">
      <canvas id="scene">Serve un browser con supporto a WebGL.</canvas>
      <canvas id="hud" width="224" height="256"></canvas>
    </div>
    <!-- Cabinet control panel: visible only on touch screens (see style.css). -->
    <div id="touch-panel" class="panel">
      <div class="pad pad-move">
        <!-- The virtual joystick: shown instead of the arrows when tuning.config.ts asks for it. -->
        <div class="stick" data-joystick="left-right" aria-hidden="true">
          <div class="stick-base"><div class="stick-knob"></div></div>
        </div>
        <button type="button" class="key key-arrow" data-key="ArrowLeft" aria-label="Sinistra">
          ◀
        </button>
        <button type="button" class="key key-arrow" data-key="ArrowRight" aria-label="Destra">
          ▶
        </button>
      </div>
      <div class="pad pad-system">
        <button type="button" class="key key-small" data-key="KeyC">MONETA</button>
        <button type="button" class="key key-small" data-key="KeyV">COLORE</button>
        <button type="button" class="key key-small" data-key="KeyM">AUDIO</button>
      </div>
      <div class="pad pad-fire">
        <button type="button" class="key key-fire" data-key="Space">FUOCO</button>
      </div>
    </div>
  </body>
</html>
