<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>insert-coin</title>
    <meta
      name="description"
      content="Giochi arcade anni '80 ricostruiti in TypeScript su HTML5 Canvas, con l'aiuto dell'AI."
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>INSERT COIN</h1>
      <p>
        Giochi arcade degli anni '80 ricostruiti da zero in TypeScript, con Claude come compagno di
        sviluppo.
      </p>

      <ul class="games">
        <li>
          <a href="./space-invaders/">
            <img src="./space-invaders.png" alt="" width="224" height="256" />
            <span class="title">SPACE INVADERS</span>
            <span class="meta">Taito, 1978</span>
          </a>
        </li>
      </ul>

      <p class="keys">
        Serve una tastiera: <kbd>C</kbd> moneta, frecce per muoversi, <kbd>Spazio</kbd> per sparare,
        <kbd>M</kbd> audio.
      </p>
      <p>
        Codice e guide passo-passo:
        <a href="https://github.com/DarkHelmet67/insert-coin"
          >github.com/DarkHelmet67/insert-coin</a
        >
      </p>
    </main>
  </body>
</html>
