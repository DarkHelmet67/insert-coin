# Checks every push to main and publishes the games on GitHub Pages (feature branches and pull
# requests are checked by ci.yml; pull requests ready for review get their own preview, see
# pr-preview.yml).
# One job verifies and builds, the next one deploys: a red check never reaches the site.
# The main site is the root of the published tree; the pr-<number> folders of the previews stay
# where they are.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to save the published tree on the gh-pages branch
  pages: write
  id-token: write

# Only one deployment at a time, previews included; a newer push waits instead of cancelling a
# deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/checks # the same checks as ci.yml
      - run: pnpm build:site
      - uses: ./.github/actions/publish-pages
        with:
          site: _site
          target: .
          message: Publish main at ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
