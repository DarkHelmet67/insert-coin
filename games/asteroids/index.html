<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Added to the home screen, the game opens without the browser's bars: the only way to get
      the whole screen on iPhone, where Safari has no fullscreen API for web pages.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Asteroids" />
    <title>Asteroids</title>
  </head>
  <body>
    <!-- Touching the screen is the START button, as on the attract screen of the cabinet. -->
    <canvas id="screen" width="1024" height="768" data-key="Enter">
      Serve un browser con supporto a Canvas.
    </canvas>
    <!--
      Cabinet control panel, visible only on touch screens (see style.css): rotation for the
      left thumb, thrust and fire for the right one, hyperspace apart so it is not hit by chance.
    -->
    <div id="touch-panel" class="panel">
      <div class="pad pad-move">
        <button
          type="button"
          class="key key-arrow"
          data-key="ArrowLeft"
          aria-label="Ruota a sinistra"
        >
          ⟲
        </button>
        <button
          type="button"
          class="key key-arrow"
          data-key="ArrowRight"
          aria-label="Ruota a destra"
        >
          ⟳
        </button>
      </div>
      <div class="pad pad-fire">
        <button type="button" class="key key-thrust" data-key="ArrowUp">SPINTA</button>
        <button type="button" class="key key-fire" data-key="Space">FUOCO</button>
      </div>
      <div class="pad pad-hyper">
        <button type="button" class="key key-small" data-key="ArrowDown">IPERSPAZIO</button>
      </div>
      <div class="pad pad-system">
        <button type="button" class="key key-small" data-key="KeyM">AUDIO</button>
      </div>
      <p class="rotate-hint">Gira il telefono: si gioca meglio in orizzontale.</p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
